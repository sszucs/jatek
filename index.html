<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Emberhalászat – Lukács 5:1–11</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="bg-orb orb-a"></div>
  <div class="bg-orb orb-b"></div>
  <div class="bg-grid"></div>

  <div class="app-shell">
    <header class="topbar">
      <div class="brand-wrap">
        <div class="brand-icon">🎣</div>
        <h1>Lukács 5:1–11</h1>
      </div>
    </header>

    <main>
      <section class="screen active" id="screen-story">
        <div class="story-shell">
          <div class="card story-visual-card">
            <div class="story-visual" id="storyVisual"></div>
          </div>
          <div class="card story-card">
            <div class="dialogue-box big">
              <div class="avatar" id="avatar">J</div>
              <div class="bubble">
                <p class="speaker" id="speaker"></p>
                <p id="storyText"></p>
              </div>
            </div>
            <div class="choices" id="choices"></div>
          </div>
        </div>
      </section>

      <section class="screen" id="screen-fishing">
        <div class="card gameplay-card">
          <div class="fishing-arena" id="fishingArena"></div>
          <button class="primary-btn big" id="inviteBtn">Meghívás</button>
        </div>
      </section>

      <section class="screen" id="screen-lesson">
        <div class="card lesson-card">
          <div id="lessonStage"></div>
        </div>
      </section>
    </main>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
